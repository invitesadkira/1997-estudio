<style>

const SUPABASE_URL = 'https://ztkyxlffygobrxlnzkum.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0a3l4bGZmeWdvYnJ4bG56a3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDY1MzksImV4cCI6MjA5Nzg4MjUzOX0.IThiNfRnaTaZnpfA-XuhWRkGmxsm3UPtvuC57QTRA3Y';
// O Supabase usa, por padrão, um "cadeado" do navegador (Web Lock) pra
// coordenar o login entre abas. Esse recurso pode travar (sem nunca
// soltar) em alguns navegadores/situações, especialmente depois de um
// refresh — foi o que te deu aquele "Carregando..." sem fim.
// A solução certa não é desligar o cadeado por completo (sem nenhuma
// fila, várias partes da tela competem pela "credencial" de login ao
// mesmo tempo e os dados somem até dar um refresh) — é usar uma fila
// só LOCAL, dentro da própria aba, sem depender do Web Lock do
// navegador (que é o que trava entre abas).
let filaDoCadeado = Promise.resolve();
const cadeadoLocal = (_nome, _tempoLimite, fn) => {
  const vezAnterior = filaDoCadeado.catch(() => {}); // erro de uma vez anterior não trava a fila
  const minhaVez = vezAnterior.then(fn);
  filaDoCadeado = minhaVez.catch(() => {});
  return minhaVez;
};

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { lock: cadeadoLocal },
});

// FORMATAÇÃO
// ============================================================
function formatMoney(value) {
  const n = Number(value || 0);
  return n.toLocaleString('pt-AO', { style: 'currency', currency: 'AOA' });
}
function formatDate(isoDate) {
  if (!isoDate) return '—';
  const [y, m, d] = isoDate.split('-');
  if (!y) return isoDate;
  return `${d}/${m}/${y}`;
}
function monthLabel(yyyyMm) {
  if (!yyyyMm) return '—';
  const [y, m] = yyyyMm.split('-');
  const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  return `${meses[Number(m) - 1] || m}/${y}`;
}

function nomeArquivo(texto) {
  return texto
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

// ============================================================
// RECIBO DE SALÁRIO EM PDF
// ============================================================
function gerarReciboSalario(salario) {
  const { jsPDF } = window.jspdf;

  const base = Number(salario.salario_base || 0);
  const bonus = Number(salario.bonus || 0);
  const descontos = Number(salario.descontos || 0);
  const liquido = base + bonus - descontos;

  // Cabeçalho
  doc.setFillColor(31, 92, 69);
  doc.rect(0, 0, 210, 32, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text('Invites', 15, 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text('Gestão Financeira', 15, 24);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('RECIBO DE PAGAMENTO DE SALÁRIO', 195, 18, { align: 'right' });

  // Dados do funcionário
  doc.setTextColor(20, 32, 27);
  let y = 46;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Funcionário:', 15, y);
  doc.setFont('helvetica', 'normal');
  doc.text(String(salario.funcionario || '—'), 52, y);

  doc.setFont('helvetica', 'bold');
  doc.text('Mês de referência:', 120, y);
  doc.setFont('helvetica', 'normal');
  doc.text(monthLabel(salario.mes_referencia), 165, y);

  y += 8;
  doc.setFont('helvetica', 'bold');
  doc.text('Cargo:', 15, y);
  doc.setFont('helvetica', 'normal');
  doc.text(String(salario.cargo || '—'), 52, y);

  doc.setFont('helvetica', 'bold');
  doc.text('Data de pagamento:', 120, y);
  doc.setFont('helvetica', 'normal');
  doc.text(formatDate(salario.data_pagamento) === '—' ? formatDate(new Date().toISOString().slice(0, 10)) : formatDate(salario.data_pagamento), 165, y);

  y += 10;
  doc.setDrawColor(184, 144, 46);
  doc.setLineWidth(0.6);
  doc.line(15, y, 195, y);

  // Tabela de valores
  y += 10;
  doc.setFillColor(241, 244, 239);
  doc.rect(15, y - 6, 180, 9, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text('Descrição', 18, y);
  doc.text('Valor', 192, y, { align: 'right' });

  const linhas = [
    ['Salário base', formatMoney(base)],
    ['Bônus', formatMoney(bonus)],
    ['Descontos', `- ${formatMoney(descontos)}`],
  ];
  doc.setFont('helvetica', 'normal');
  linhas.forEach(([label, valor]) => {
    y += 10;
    doc.text(label, 18, y);
    doc.text(valor, 192, y, { align: 'right' });
    doc.setDrawColor(220, 227, 220);
    doc.setLineWidth(0.2);
    doc.line(15, y + 3, 195, y + 3);
  });

  y += 12;
  doc.setFillColor(31, 92, 69);
  doc.rect(15, y - 6, 180, 10, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('VALOR LÍQUIDO', 18, y);
  doc.text(formatMoney(liquido), 192, y, { align: 'right' });

  // Declaração + assinaturas
  doc.setTextColor(20, 32, 27);
  y += 26;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(
    'Eu, abaixo assinado(a), confirmo o recebimento do valor líquido acima referente ao mês indicado.',
    15, y, { maxWidth: 180 }
  );

  y += 28;
  doc.setDrawColor(20, 32, 27);
  doc.setLineWidth(0.3);
  doc.line(20, y, 95, y);
  doc.line(115, y, 190, y);
  doc.setFontSize(9);
  doc.text('Assinatura do(a) Funcionário(a)', 20, y + 6);
  doc.text('Assinatura — Invites', 115, y + 6);

  // Rodapé
  doc.setFontSize(8);
  doc.setTextColor(150, 150, 150);
  doc.text(
    `Documento gerado pelo sistema de gestão financeira da Invites em ${new Date().toLocaleString('pt-AO')}.`,
    15, 285
  );

  const arquivo = `recibo-${nomeArquivo(salario.funcionario || 'funcionario')}-${salario.mes_referencia || ''}.pdf`;
  doc.save(arquivo);
}

// ============================================================
// CAMADA DE DADOS (fala com o Supabase)
// ============================================================
function makeResource(table) {
  return {
    async list() {
      const { data, error } = await sb.from(table).select('*').order('criado_em', { ascending: false });
      if (error) { console.error(`Erro ao listar "${table}":`, error.message); return []; }
      return data ?? [];
    },
    async add(item) {
      const { data, error } = await sb.from(table).insert(item).select().single();
      if (error) { console.error(`Erro ao criar em "${table}":`, error.message); throw error; }
      return data;
    },
    async update(id, patch) {
      const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single();
      if (error) { console.error(`Erro ao atualizar em "${table}":`, error.message); throw error; }
      return data;
    },
    async remove(id) {
      const { error } = await sb.from(table).delete().eq('id', id);
      if (error) { console.error(`Erro ao excluir em "${table}":`, error.message); throw error; }
    },
  };
}

function useCollection(resourceName) {
  const resource = db[resourceName];
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState('');

  const reload = useCallback(async () => {
    setLoading(true);
    setLoadError('');
    try {
      const data = await withTimeout(resource.list(), 12000, `carregar ${resourceName}`);
      setItems(data);
    } catch (err) {
      console.error(`Erro ao carregar "${resourceName}":`, err);
      setLoadError(err.message || 'Não foi possível carregar os dados.');
      setItems([]);
    } finally {
      setLoading(false);
    }
  }, [resource, resourceName]);

  useEffect(() => { reload(); }, [reload]);

  const add = useCallback(async (item) => { await resource.add(item); await reload(); }, [resource, reload]);
  const update = useCallback(async (id, patch) => { await resource.update(id, patch); await reload(); }, [resource, reload]);
  const remove = useCallback(async (id) => { await resource.remove(id); await reload(); }, [resource, reload]);

  return { items, loading, loadError, add, update, remove, reload };
}

const AuthContext = createContext(null);

async function loadProfile(userId) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (error) { console.error('Erro ao carregar perfil:', error.message); return null; }
  return data;
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(
      `Demorou demais pra responder (${label}). Isso costuma acontecer quando há outras abas do mesmo programa abertas ao mesmo tempo — tente fechar as outras abas e recarregar, ou reiniciar o navegador.`
    )), ms)),
  ]);
}

function AuthProvider({ children }) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [initError, setInitError] = useState('');

  useEffect(() => {
    let active = true;

    (async () => {
      try {
        const { data, error } = await withTimeout(sb.auth.getSession(), 6000, 'verificar sessão');
        if (error) {
          // Sessão antiga/inválida guardada no navegador (comum depois de testes,
          // ou quando o login foi excluído/recriado no Supabase). Limpa e segue
          // pra tela de login, em vez de travar com erro.
          if (String(error.message || '').toLowerCase().includes('refresh token')) {
            await sb.auth.signOut();
            if (active) setLoading(false);
            return;
          }
          throw error;
        }
        if (!active) return;
        setSession(data.session);
        if (data.session?.user) {
          const prof = await withTimeout(loadProfile(data.session.user.id), 6000, 'carregar perfil');
          if (!active) return;
          setProfile(prof);
          if (prof) ensureServicosSeed();
        }
      } catch (err) {
        console.error('Erro ao iniciar sessão:', err);
        if (String(err.message || '').toLowerCase().includes('refresh token')) {
          await sb.auth.signOut();
          if (active) setLoading(false);
          return;
        }
        if (active) setInitError(err.message || 'Erro ao conectar com o Supabase.');
      } finally {
        if (active) setLoading(false);
      }
    })();

    const { data: listener } = sb.auth.onAuthStateChange(async (_event, newSession) => {
      setSession(newSession);
      if (newSession?.user) {
        const prof = await loadProfile(newSession.user.id);
        setProfile(prof);
      } else {
        setProfile(null);
      }
    });

    return () => { active = false; listener.subscription.unsubscribe(); };
  }, []);

  const login = useCallback(async (email, senha) => {
    try {
      const { data, error } = await withTimeout(
        sb.auth.signInWithPassword({ email: email.trim(), password: senha }),
        8000,
        'entrar'
      );
      if (error) return { ok: false, error: 'E-mail ou senha incorretos.' };

      const prof = await withTimeout(loadProfile(data.user.id), 8000, 'carregar perfil');
      if (!prof) {
        await sb.auth.signOut();
        return { ok: false, error: 'Este login existe, mas ainda não tem acesso liberado. Fale com o Admin God.' };
      }
      if (!prof.ativo) {
        await sb.auth.signOut();
        return { ok: false, error: 'Este usuário está desativado. Fale com o Admin God.' };
      }
      setProfile(prof);
      ensureServicosSeed();
      return { ok: true };
    } catch (err) {
      return { ok: false, error: err.message || 'Erro ao entrar.' };
    }
  }, []);

  const logout = useCallback(async () => { await sb.auth.signOut(); setProfile(null); }, []);

  const refreshUser = useCallback(async () => {
    if (!session?.user) return;
    const prof = await loadProfile(session.user.id);
    setProfile(prof);
  }, [session]);

  const isAdminGod = profile?.role === 'admin_god';
  const canSeeTotais = isAdminGod || !!profile?.ver_totais;

  const hasAccess = useCallback((pageKey) => {
    if (!profile) return false;
    if (isAdminGod) return true;
    return profile.allowed_pages?.includes(pageKey);
  }, [profile, isAdminGod]);

  return (
    <AuthContext.Provider value={{ user: profile, loading, initError, login, logout, refreshUser, isAdminGod, canSeeTotais, hasAccess }}>
      {children}
    </AuthContext.Provider>
  );
}

function useAuth() {
  const ctx = useContext(AuthContext);
  if (!ctx) throw new Error('useAuth precisa estar dentro de <AuthProvider>');
  return ctx;
}

function MonthlyChart({ data }) {
  const max = Math.max(1, ...data.map((d) => Math.max(d.entradas, d.saidas)));
  return (
    <div>
      <div className="chart-panel">
        {data.map((d) => (
          <div className="chart-bar-group" key={d.mes}>
            <div className="chart-bars">
              <div
                className="chart-bar entradas"
                title={`Entradas: ${formatMoney(d.entradas)}`}
                style={{ height: `${(d.entradas / max) * 100}%` }}
              />
              <div
                className="chart-bar saidas"
                title={`Saídas: ${formatMoney(d.saidas)}`}
                style={{ height: `${(d.saidas / max) * 100}%` }}
              />
            </div>
            <div className="chart-label">{d.mes}</div>
          </div>
        ))}
      </div>
      <div className="chart-legend">
        <span><span className="dot" style={{ background: 'var(--success)' }} /> Entradas</span>
        <span><span className="dot" style={{ background: 'var(--danger)' }} /> Saídas + despesas + salários</span>
      </div>
    </div>
  );
}

// PÁGINA GENÉRICA DE REGISTROS (Entradas, Saídas, Despesas, Salários, Serviços)

const emptyFromFields = (fields) =>
  fields.reduce((acc, f) => {
    if (f.defaultValue !== undefined) acc[f.key] = f.defaultValue;
    else if (f.type === 'date') acc[f.key] = new Date().toISOString().slice(0, 10);
    else acc[f.key] = '';
    return acc;
  }, {});

function RecordsPage({
  resource, eyebrow, title, subtitle, fields, getValue, valueLabel = 'Valor',
  valueFieldKey, renderCell, statusField, statusTones = {}, page, onNavigate,
  showTotal = true, summaryCardsFn, filterItems, topPanel, pagamentoConfig,
}) {
  const { items: rawItems, loading, add, update, remove } = useCollection(resource);
  const { items: servicosOptions } = useCollection('servicos');
  const items = useMemo(() => (filterItems ? filterItems(rawItems) : rawItems), [rawItems, filterItems]);

  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyFromFields(fields));
  const [error, setError] = useState('');
  const [pagandoId, setPagandoId] = useState(null);

  const total = useMemo(() => items.reduce((sum, it) => sum + (getValue(it) || 0), 0), [items, getValue]);
  const summaryCards = useMemo(() => (summaryCardsFn ? summaryCardsFn(items) : null), [summaryCardsFn, items]);
  const tableFields = useMemo(() => fields.filter((f) => f.key !== valueFieldKey), [fields, valueFieldKey]);

  async function handlePagar(item) {
    setPagandoId(item.id);
    try {
      const patch = { [statusField]: pagamentoConfig.valuePago };
      if (pagamentoConfig.dataField) patch[pagamentoConfig.dataField] = new Date().toISOString().slice(0, 10);
      if (pagamentoConfig.ajustarPatch) {
        const extra = pagamentoConfig.ajustarPatch(item);
        if (extra === null) { setPagandoId(null); return; } // cancelado na confirmação
        Object.assign(patch, extra);
      }
      await update(item.id, patch);
      if (pagamentoConfig.onPago) await pagamentoConfig.onPago({ ...item, ...patch });
    } catch (err) {
      alert(err.message || 'Não foi possível registrar o pagamento.');
    } finally {
      setPagandoId(null);
    }
  }

  function optionsForField(f) {
    if (f.optionsFrom === 'servicos') {
      return servicosOptions.filter((s) => s.ativo === 'Sim').map((s) => `${s.nome} — ${s.categoria}`);
    }
    return f.options || [];
  }

  function openNew() { setForm(emptyFromFields(fields)); setEditingId(null); setError(''); setModalOpen(true); }
  function openEdit(item) { setForm({ ...emptyFromFields(fields), ...item }); setEditingId(item.id); setError(''); setModalOpen(true); }
  function handleChange(key, value) { setForm((f) => ({ ...f, [key]: value })); }

  async function handleSubmit(e) {
    e.preventDefault();
    for (const f of fields) {
      if (f.required && !String(form[f.key] ?? '').trim()) {
        setError(`Preencha o campo "${f.label}".`);
        return;
      }
    }
    const payload = { ...form };
    fields.forEach((f) => { if (f.type === 'number') payload[f.key] = Number(payload[f.key] || 0); });
    try {
      if (editingId) await update(editingId, payload); else await add(payload);
      setModalOpen(false);
    } catch (err) {
      setError(err.message || 'Não foi possível salvar. Confira os dados e tente de novo.');
    }
  }

  async function handleDelete(id) {
    if (!confirm('Tem certeza que deseja excluir este registro?')) return;
    try {
      await remove(id);
    } catch (err) {
      alert(err.message || 'Não foi possível excluir este registro.');
    }
  }

  return (
    <Layout title={title} subtitle={subtitle} page={page} onNavigate={onNavigate}>
      <div className="page-toolbar">
        <div className="title-block">
          {eyebrow && <div className="eyebrow">{eyebrow}</div>}
          <h2>{items.length} registro{items.length === 1 ? '' : 's'}</h2>
        </div>
        <button className="btn btn-primary" onClick={openNew}>+ Novo registro</button>
      </div>

      {topPanel}

      {showTotal && (
        <div className="stat-grid" style={{ marginBottom: 18, gridTemplateColumns: summaryCards ? undefined : '1fr' }}>
          {summaryCards ? (
            summaryCards.map((c) => <StatCard key={c.label} label={c.label} value={c.value} tone={c.tone || 'neutral'} />)
          ) : (
            <div className="stat-card">
              <div className="stat-label">Total em {title}</div>
              <div className="stat-value neutral">{formatMoney(total)}</div>
            </div>
          )}
        </div>
      )}

      <div className="table-wrap">
        {loading ? (
          <div className="empty-state">Carregando…</div>
        ) : items.length === 0 ? (
          <div className="empty-state">
            <div className="big">Nenhum registro ainda</div>
            <div>Clique em "Novo registro" pra lançar o primeiro.</div>
          </div>
        ) : (
          <table>
            <thead>
              <tr>
                {tableFields.map((f) => <th key={f.key}>{f.label}</th>)}
                <th>{valueLabel}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {items.map((item) => (
                <tr key={item.id}>
                  {tableFields.map((f) => (
                    <td key={f.key}>{renderCell?.(f, item) ?? defaultCell(f, item, statusField, statusTones)}</td>
                  ))}
                  <td className="cell-valor">{formatMoney(getValue(item))}</td>
                  <td>
                    <div className="row-actions">
                      {pagamentoConfig && pagamentoConfig.condicao(item) && (
                        <button className="btn btn-primary btn-sm" disabled={pagandoId === item.id} onClick={() => handlePagar(item)}>
                          {pagandoId === item.id ? 'Aguarde…' : pagamentoConfig.label}
                        </button>
                      )}
                      {pagamentoConfig?.onPago && !pagamentoConfig.condicao(item) && pagamentoConfig.mostrarReciboSempre && (
                        <button className="btn btn-ghost btn-sm" onClick={() => pagamentoConfig.onPago(item)}>Recibo</button>
                      )}
                      <button className="btn btn-ghost btn-sm" onClick={() => openEdit(item)}>Editar</button>
                      <button className="btn btn-danger btn-sm" onClick={() => handleDelete(item.id)}>Excluir</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modalOpen && (
        <Modal title={editingId ? 'Editar registro' : 'Novo registro'} onClose={() => setModalOpen(false)}>
          <form onSubmit={handleSubmit}>
            {error && <div className="form-error">{error}</div>}
            <div className="form-grid">
              {fields.map((f) => (
                <div className={`field ${f.full ? 'full' : ''}`} key={f.key}>
                  <label>{f.label}{f.required && ' *'}</label>
                  {f.type === 'select' ? (
                    <select value={form[f.key] ?? ''} onChange={(e) => handleChange(f.key, e.target.value)}>
                      <option value="">Selecione…</option>
                      {optionsForField(f).length === 0 && f.optionsFrom && (
                        <option value="" disabled>Nenhum serviço ativo encontrado — cadastre em "Serviços"</option>
                      )}
                      {optionsForField(f).map((opt) => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                  ) : (
                    <input
                      type={f.type === 'month' ? 'month' : f.type}
                      step={f.type === 'number' ? '0.01' : undefined}
                      value={form[f.key] ?? ''}
                      onChange={(e) => handleChange(f.key, e.target.value)}
                    />
                  )}
                </div>
              ))}
            </div>
            <div className="form-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setModalOpen(false)}>Cancelar</button>
              <button type="submit" className="btn btn-primary">Salvar</button>
            </div>
          </form>
        </Modal>
      )}
    </Layout>
  );
}

function defaultCell(field, item, statusField, statusTones) {
  const value = item[field.key];
  if (field.key === statusField) {
    const tone = statusTones[value] || 'neutral';
    return <span className={`badge badge-${tone}`}>{value || '—'}</span>;
  }
  if (field.type === 'date') return formatDate(value);
  if (field.type === 'month') return monthLabel(value);
  if (field.type === 'number') return value ? Number(value).toLocaleString('pt-AO') : '0';
  return value || '—';
}

  { key: 'servico', label: 'Serviço vendido (opcional)', type: 'select', optionsFrom: 'servicos', full: true },
  { key: 'forma_pagamento', label: 'Forma de pagamento', type: 'select', options: ['Transferência Express', 'IBAN', 'Dinheiro', 'Cartão', 'Outro'] },
  { key: 'status', label: 'Status', type: 'select', required: true, options: ['Recebido', 'Pendente'], defaultValue: 'Recebido' },

function Login() {
  const { login } = useAuth();
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setSubmitting(true);
    setError('');
    const result = await login(email, senha);
    setSubmitting(false);
    if (!result.ok) setError(result.error);
  }

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-brand">
          <div className="name">Invites</div>
          <div className="tag">Gestão Financeira</div>
        </div>
        <form onSubmit={handleSubmit}>
          {error && <div className="form-error">{error}</div>}
          <div className="field" style={{ marginBottom: 14 }}>
            <label>E-mail</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} autoFocus required />
          </div>
          <div className="field">
            <label>Senha</label>
            <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} required />
          </div>
          <button type="submit" className="btn btn-primary" disabled={submitting}>
            {submitting ? 'Entrando…' : 'Entrar'}
          </button>
        </form>
        <div className="login-hint">Não tem login ainda? Fale com o Admin God da sua equipe.</div>
      </div>
    </div>
  );
}

function Dashboard({ page, onNavigate }) {
  const { isAdminGod, canSeeTotais } = useAuth();
  const { items: entradas, loading: l1 } = useCollection('entradas');
  const { items: saidas, loading: l2 } = useCollection('saidas');
  const { items: despesasRaw, loading: l3 } = useCollection('despesas');
  const { items: salarios, loading: l4 } = useCollection('salarios');
  const { items: encomendas, loading: l5 } = useCollection('encomendas');
  const { items: saldoInicialRaw, loading: l6 } = useCollection('saldo_inicial');
  const loading = l1 || l2 || l3 || l4 || l5 || l6;

  const despesasEmpresa = useMemo(() => despesasRaw.filter((i) => i.tipo !== 'Pessoal'), [despesasRaw]);
  const despesasPessoais = useMemo(() => despesasRaw.filter((i) => i.tipo === 'Pessoal'), [despesasRaw]);

  const sumValor = (arr) => arr.reduce((s, i) => s + Number(i.valor || 0), 0);
  const sumPago = (arr) => arr.reduce((s, i) => s + Number(i.valor_pago || 0), 0);
  // itens marcados como "histórico" já estavam pagos antes deste sistema —
  // não entram no cálculo do Saldo (já estão refletidos no Saldo Inicial)
  const naoHistorico = (arr) => arr.filter((i) => i.historico !== 'Sim');
  const totalEntradasLivres = useMemo(() => sumValor(entradas), [entradas]);
  const totalRecebidoEncomendas = useMemo(() => sumPago(encomendas), [encomendas]);
  const totalEntradas = totalEntradasLivres + totalRecebidoEncomendas;
  const totalSaidas = useMemo(() => sumValor(saidas), [saidas]);
  const totalDespesas = useMemo(() => sumValor(despesasEmpresa), [despesasEmpresa]);
  const totalDespesasPessoais = useMemo(() => sumValor(despesasPessoais), [despesasPessoais]);
  const totalSalarios = useMemo(() => salarios.reduce((s, i) => s + salarioLiquido(i), 0), [salarios]);
  const totalDespesasParaSaldo = useMemo(() => sumValor(naoHistorico(despesasEmpresa)), [despesasEmpresa]);
  const totalSalariosParaSaldo = useMemo(() => naoHistorico(salarios).reduce((s, i) => s + salarioLiquido(i), 0), [salarios]);
  const totalSaldoInicial = useMemo(() => sumValor(saldoInicialRaw), [saldoInicialRaw]);
  const saldo = totalEntradas + totalSaldoInicial - totalSaidas - totalDespesasParaSaldo - totalSalariosParaSaldo;

  // ---------- Alocação automática do caixa disponível ----------
  // Prioridade: 1º salários, 2º despesas da empresa, 3º despesas pessoais.
  // "Caixa disponível" = tudo que já entrou (+ saldo inicial) menos o que já
  // foi de fato pago (saídas + o que já está marcado como Pago, sem contar
  // o que é histórico — esse já está refletido no Saldo Inicial).
  const salariosPagos = useMemo(() => naoHistorico(salarios).filter((i) => i.status === 'Pago').reduce((s, i) => s + salarioLiquido(i), 0), [salarios]);
  const salariosPendentesLista = useMemo(() => salarios.filter((i) => i.status === 'Pendente'), [salarios]);
  const totalSalariosPendentes = useMemo(() => salariosPendentesLista.reduce((s, i) => s + salarioLiquido(i), 0), [salariosPendentesLista]);

  const despesasEmpresaPagas = useMemo(() => naoHistorico(despesasEmpresa).filter((i) => i.status === 'Pago').reduce((s, i) => s + Number(i.valor || 0), 0), [despesasEmpresa]);
  const totalDespesasEmpresaPendentes = useMemo(() => despesasEmpresa.filter((i) => i.status === 'Pendente').reduce((s, i) => s + Number(i.valor || 0), 0), [despesasEmpresa]);

  const totalDespesasPessoaisPendentes = useMemo(() => despesasPessoais.filter((i) => i.status === 'Pendente').reduce((s, i) => s + Number(i.valor || 0), 0), [despesasPessoais]);

  const caixaDisponivel = totalEntradas + totalSaldoInicial - totalSaidas - salariosPagos - despesasEmpresaPagas;

  const paraSalarios = Math.min(caixaDisponivel, totalSalariosPendentes);
  const restoAposSalarios = Math.max(0, caixaDisponivel - totalSalariosPendentes);
  const faltaSalarios = Math.max(0, totalSalariosPendentes - caixaDisponivel);

  const paraDespesas = Math.min(restoAposSalarios, totalDespesasEmpresaPendentes);
  const restoAposDespesas = Math.max(0, restoAposSalarios - totalDespesasEmpresaPendentes);
  const faltaDespesas = Math.max(0, totalDespesasEmpresaPendentes - restoAposSalarios);

  const paraPessoais = Math.min(restoAposDespesas, totalDespesasPessoaisPendentes);
  const sobraLivre = Math.max(0, restoAposDespesas - totalDespesasPessoaisPendentes);
  const faltaPessoais = Math.max(0, totalDespesasPessoaisPendentes - restoAposDespesas);

  const chartData = useMemo(() => {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }
    return months.map((mk) => {
      const e = sumValor(entradas.filter((i) => (i.data || '').slice(0, 7) === mk));
      // o pagamento da encomenda é atribuído ao mês da data de entrada do pedido
      // (o programa não guarda em qual dia exato cada parcela foi paga)
      const enc = sumPago(encomendas.filter((i) => (i.data_entrada || '').slice(0, 7) === mk));
      const s = sumValor(saidas.filter((i) => (i.data || '').slice(0, 7) === mk));
      const d = sumValor(despesasEmpresa.filter((i) => (i.data || '').slice(0, 7) === mk));
      const sal = salarios.filter((i) => i.mes_referencia === mk).reduce((sum, i) => sum + salarioLiquido(i), 0);
      const [y, m] = mk.split('-');
      return { mes: `${m}/${y.slice(2)}`, entradas: e + enc, saidas: s + d + sal };
    });
  }, [entradas, encomendas, saidas, despesasEmpresa, salarios]);

  if (!canSeeTotais) {
    return (
      <Layout title="Dashboard" subtitle="Visão geral das finanças da Invites" page={page} onNavigate={onNavigate}>
        <div className="panel">
          <div className="empty-state">
            <div className="big">Totais não liberados</div>
            <div>O Admin God ainda não liberou pra você ver os totais e relatórios. Você ainda pode usar as outras páginas normalmente.</div>
          </div>
        </div>
      </Layout>
    );
  }

  return (
    <Layout title="Dashboard" subtitle="Visão geral das finanças da Invites" page={page} onNavigate={onNavigate}>
      <div className="stat-grid">
        <StatCard label="Total de entradas" value={totalEntradas} tone="positive" />
        <StatCard label="— recebido em Encomendas" value={totalRecebidoEncomendas} tone="positive" />
        <StatCard label="— outras entradas" value={totalEntradasLivres} tone="positive" />
        <StatCard label="Saldo inicial (antes do sistema)" value={totalSaldoInicial} tone="neutral" />
        <StatCard label="Total de saídas" value={totalSaidas} tone="negative" />
        <StatCard label="Total de despesas (empresa)" value={totalDespesas} tone="negative" />
        <StatCard label="Total de salários" value={totalSalarios} tone="negative" />
        <StatCard label="Saldo" value={saldo} tone={saldo >= 0 ? 'positive' : 'negative'} />
        {isAdminGod && <StatCard label="Despesas pessoais (só você vê)" value={totalDespesasPessoais} tone="negative" />}
      </div>
      <p style={{ fontSize: 12, color: 'var(--muted)', marginTop: -14, marginBottom: 18 }}>
        O Saldo não desconta despesas/salários marcados como "já pago antes deste sistema" — esse dinheiro já está refletido no Saldo Inicial.
      </p>

      <div className="panel" style={{ marginBottom: 18 }}>
        <div className="panel-title">Pra onde vai o caixa disponível</div>
        <p style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: -6, marginBottom: 14 }}>
          Ordem de prioridade: 1º salários pendentes, depois despesas da empresa pendentes
          {isAdminGod ? ', depois suas despesas pessoais pendentes' : ''}.
        </p>
        <div className="stat-grid" style={{ marginBottom: 0 }}>
          <StatCard label="Caixa disponível agora" value={caixaDisponivel} tone={caixaDisponivel >= 0 ? 'positive' : 'negative'} />
          <StatCard
            label={faltaSalarios > 0 ? `Salários — falta ${formatMoney(faltaSalarios)}` : 'Salários pendentes cobertos'}
            value={paraSalarios} tone={faltaSalarios > 0 ? 'negative' : 'positive'}
          />
          <StatCard
            label={faltaDespesas > 0 ? `Despesas empresa — falta ${formatMoney(faltaDespesas)}` : 'Despesas da empresa cobertas'}
            value={paraDespesas} tone={faltaDespesas > 0 ? 'negative' : 'positive'}
          />
          {isAdminGod && (
            <StatCard
              label={faltaPessoais > 0 ? `Despesas pessoais — falta ${formatMoney(faltaPessoais)}` : 'Despesas pessoais cobertas'}
              value={paraPessoais} tone={faltaPessoais > 0 ? 'negative' : 'positive'}
            />
          )}
          <StatCard label="Sobra livre, depois de cobrir tudo" value={isAdminGod ? sobraLivre : restoAposDespesas} tone="positive" />
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">Entradas x Saídas (últimos 6 meses)</div>
        {loading ? <div className="empty-state">Carregando…</div> : <MonthlyChart data={chartData} />}
      </div>
    </Layout>
  );
}

function despesaEstaAtrasada(item) {
  const diaVenc = Number(item.dia_vencimento || 0);
  if (item.status !== 'Pendente' || !diaVenc) return false;
  return new Date().getDate() > diaVenc;
}

function somarDiasUteis(data, dias) {
  const resultado = new Date(data);
  let restantes = dias;
  while (restantes > 0) {
    resultado.setDate(resultado.getDate() + 1);
    const diaDaSemana = resultado.getDay(); // 0 = domingo, 6 = sábado
    if (diaDaSemana !== 0 && diaDaSemana !== 6) restantes -= 1;
  }
  return resultado;
}

function calcularDataEntrega(dataEntradaStr, servico, urgencia) {
  if (!dataEntradaStr || !servico) return '';
  const dataEntrada = new Date(dataEntradaStr + 'T00:00:00');
  if (urgencia === 'Urgente') {
    // Urgente: prazo corrido (horas), conta sábado, domingo e feriado normalmente.
    const horas = Number(servico.prazo_urgencia_horas || 24);
    const entrega = new Date(dataEntrada.getTime() + horas * 60 * 60 * 1000);
    return entrega.toISOString().slice(0, 10);
  }
  // Normal: prazo em dias ÚTEIS — sábado e domingo não contam.
  const dias = Number(servico.prazo_normal_dias || 3);
  const entrega = somarDiasUteis(dataEntrada, dias);
  return entrega.toISOString().slice(0, 10);
}

  const emptyForm = {
    cliente: '', servico: '', data_entrada: new Date().toISOString().slice(0, 10),
    data_entrega: '', urgencia: 'Normal', quantidade: 1, valor_total: '', valor_pago: '',
    forma_pagamento: '', status: 'Pendente', observacoes: '',
  };
  const [form, setForm] = useState(emptyForm);
  const [error, setError] = useState('');

  const servicoSelecionado = useMemo(
    () => servicosAtivos.find((s) => `${s.nome} — ${s.categoria}` === form.servico),
    [servicosAtivos, form.servico]
  );

  function aplicarAutoCalculo(patch) {
    setForm((f) => {
      const novo = { ...f, ...patch };
      const servico = servicosAtivos.find((s) => `${s.nome} — ${s.categoria}` === novo.servico);
      if (servico) {
        const porUnidade = servico.preco_por_unidade === 'Sim';
        const quantidade = porUnidade ? Math.max(1, Number(novo.quantidade || 1)) : 1;
        const precoBase = Number(servico.preco || 0) * quantidade + (novo.urgencia === 'Urgente' ? Number(servico.taxa_urgencia || 0) : 0);
        novo.valor_total = precoBase;
        novo.data_entrega = calcularDataEntrega(novo.data_entrada, servico, novo.urgencia);
      }
      return novo;
    });
  }

  function openNew() { setForm(emptyForm); setEditingId(null); setError(''); setModalOpen(true); }
  function openEdit(item) { setForm({ ...emptyForm, ...item }); setEditingId(item.id); setError(''); setModalOpen(true); }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.cliente.trim() || !form.servico) { setError('Preencha o cliente e o serviço.'); return; }
    const payload = {
      ...form,
      quantidade: Number(form.quantidade || 1),
      valor_total: Number(form.valor_total || 0),
      valor_pago: Number(form.valor_pago || 0),
      data_entrega: form.data_entrega || null,
    };
    try {
      if (editingId) await update(editingId, payload); else await add(payload);
      setModalOpen(false);
    } catch (err) {
      setError(err.message || 'Não foi possível salvar. Confira os dados e tente de novo.');
    }
  }

  async function handleDelete(id) {
    if (!confirm('Excluir esta encomenda?')) return;
    try {
      await remove(id);
    } catch (err) {
      alert(err.message || 'Não foi possível excluir esta encomenda.');
    }
  }

  const percentualPago = (item) => {
    const total = Number(item.valor_total || 0);
    if (total <= 0) return 0;
    return Math.round((Number(item.valor_pago || 0) / total) * 100);
  };

  const hoje = new Date().toISOString().slice(0, 10);

  return (
    <Layout title="Encomendas" subtitle="Pedidos dos clientes: prazos, urgência e pagamentos" page={page} onNavigate={onNavigate}>
      <div className="page-toolbar">
        <div className="title-block">
          <div className="eyebrow">Trabalhos</div>
          <h2>{encomendas.length} encomenda{encomendas.length === 1 ? '' : 's'}</h2>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn btn-ghost" onClick={() => setMostrarPagamento((v) => !v)}>
            {mostrarPagamento ? 'Ocultar' : 'Ver'} dados de pagamento
          </button>
          <button className="btn btn-primary" onClick={openNew}>+ Nova encomenda</button>
        </div>
      </div>

      {mostrarPagamento && <DadosPagamento />}

      <div className="table-wrap">
        {loading ? (
          <div className="empty-state">Carregando…</div>
        ) : encomendas.length === 0 ? (
          <div className="empty-state">
            <div className="big">Nenhuma encomenda ainda</div>
            <div>Clique em "Nova encomenda" pra registrar o primeiro pedido.</div>
          </div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Cliente</th><th>Serviço</th><th>Entrada</th><th>Entrega</th><th>Urgência</th>
                <th>Pago</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody>
              {encomendas.map((item) => {
                const pct = percentualPago(item);
                const atrasado = item.status === 'Pendente' && item.data_entrega && item.data_entrega < hoje;
                return (
                  <tr key={item.id}>
                    <td>{item.cliente}</td>
                    <td>{item.servico || '—'}</td>
                    <td>{formatDate(item.data_entrada)}</td>
                    <td>{formatDate(item.data_entrega)}</td>
                    <td><span className={`badge ${item.urgencia === 'Urgente' ? 'badge-danger' : 'badge-neutral'}`}>{item.urgencia}</span></td>
                    <td className="cell-valor">{formatMoney(item.valor_pago)} <span style={{ color: 'var(--muted)', fontWeight: 400 }}>({pct}%)</span></td>
                    <td>
                      {atrasado ? (
                        <span className="badge badge-danger">Atrasado</span>
                      ) : (
                        <span className={`badge ${item.status === 'Concluído' ? 'badge-success' : 'badge-warning'}`}>{item.status}</span>
                      )}
                    </td>
                    <td>
                      <div className="row-actions">
                        <button className="btn btn-ghost btn-sm" onClick={() => openEdit(item)}>Editar</button>
                        <button className="btn btn-danger btn-sm" onClick={() => handleDelete(item.id)}>Excluir</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {modalOpen && (
        <Modal title={editingId ? 'Editar encomenda' : 'Nova encomenda'} onClose={() => setModalOpen(false)}>
          <form onSubmit={handleSubmit}>
            {error && <div className="form-error">{error}</div>}
            <div className="form-grid">
              <div className="field full">
                <label>Cliente *</label>
                <input value={form.cliente} onChange={(e) => setForm((f) => ({ ...f, cliente: e.target.value }))} />
              </div>
              <div className="field full">
                <label>Serviço *</label>
                <select value={form.servico} onChange={(e) => aplicarAutoCalculo({ servico: e.target.value })}>
                  <option value="">Selecione…</option>
                  {servicosAtivos.length === 0 && <option value="" disabled>Nenhum serviço ativo — cadastre em "Serviços"</option>}
                  {servicosAtivos.map((s) => (
                    <option key={s.id} value={`${s.nome} — ${s.categoria}`}>{s.nome} — {s.categoria}</option>
                  ))}
                </select>
              </div>
              <div className="field">
                <label>Urgência</label>
                <select value={form.urgencia} onChange={(e) => aplicarAutoCalculo({ urgencia: e.target.value })}>
                  <option value="Normal">Normal</option>
                  <option value="Urgente">Urgente {servicoSelecionado ? `(+${formatMoney(servicoSelecionado.taxa_urgencia)})` : ''}</option>
                </select>
              </div>
              {servicoSelecionado?.preco_por_unidade === 'Sim' && (
                <div className="field">
                  <label>Quantidade</label>
                  <input type="number" min="1" value={form.quantidade} onChange={(e) => aplicarAutoCalculo({ quantidade: e.target.value })} />
                </div>
              )}
              <div className="field">
                <label>Status</label>
                <select value={form.status} onChange={(e) => setForm((f) => ({ ...f, status: e.target.value }))}>
                  <option value="Pendente">Pendente</option>
                  <option value="Concluído">Concluído</option>
                </select>
              </div>
              <div className="field">
                <label>Data de entrada</label>
                <input type="date" value={form.data_entrada} onChange={(e) => aplicarAutoCalculo({ data_entrada: e.target.value })} />
              </div>
              <div className="field">
                <label>Data de entrega (sugerida, pode ajustar)</label>
                <input type="date" value={form.data_entrega} onChange={(e) => setForm((f) => ({ ...f, data_entrega: e.target.value }))} />
              </div>
              <div className="field">
                <label>Valor total (Kz)</label>
                <input type="number" step="0.01" value={form.valor_total} onChange={(e) => setForm((f) => ({ ...f, valor_total: e.target.value }))} />
              </div>
              <div className="field">
                <label>Valor pago (Kz)</label>
                <input type="number" step="0.01" value={form.valor_pago} onChange={(e) => setForm((f) => ({ ...f, valor_pago: e.target.value }))} />
              </div>
              <div className="field full">
                <div className="form-info" style={{ margin: 0 }}>
                  Percentual pago: <strong>{form.valor_total ? Math.round((Number(form.valor_pago || 0) / Number(form.valor_total || 1)) * 100) : 0}%</strong>
                  {' '}(calculado automaticamente a partir do valor pago e do valor total)
                </div>
              </div>
              <div className="field full">
                <label>Forma de pagamento</label>
                <select value={form.forma_pagamento} onChange={(e) => setForm((f) => ({ ...f, forma_pagamento: e.target.value }))}>
                  <option value="">Selecione…</option>
                  <option value="Transferência Express">Transferência Express</option>
                  <option value="IBAN">IBAN</option>
                  <option value="Dinheiro">Dinheiro</option>
                  <option value="Cartão">Cartão</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
              <div className="field full">
                <label>Avisos/observações</label>
                <input value={form.observacoes} onChange={(e) => setForm((f) => ({ ...f, observacoes: e.target.value }))} />
              </div>
            </div>
            <div className="form-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setModalOpen(false)}>Cancelar</button>
              <button type="submit" className="btn btn-primary">Salvar</button>
            </div>
          </form>
        </Modal>
      )}
    </Layout>
  );
}

function Usuarios({ page, onNavigate }) {
  const { items: perfis, loading, update, reload } = useCollection('profiles');
  const { user: currentUser, refreshUser } = useAuth();

  const emptyForm = { nome: '', email: '', senha: '', allowed_pages: [], ver_totais: false, ativo: true };
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);

  function openNew() { setForm(emptyForm); setEditingId(null); setError(''); setModalOpen(true); }
  function openEdit(p) {
    setForm({ nome: p.nome, email: p.email, senha: '', allowed_pages: p.allowed_pages || [], ver_totais: !!p.ver_totais, ativo: p.ativo });
    setEditingId(p.id);
    setError('');
    setModalOpen(true);
  }
  function togglePage(key) {
    setForm((f) => ({
      ...f,
      allowed_pages: f.allowed_pages.includes(key) ? f.allowed_pages.filter((k) => k !== key) : [...f.allowed_pages, key],
    }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nome.trim() || !form.email.trim()) { setError('Preencha nome e e-mail.'); return; }
    if (!editingId && !form.senha.trim()) { setError('Defina uma senha inicial para o novo usuário.'); return; }
    setSaving(true);
    setError('');
    try {
      if (editingId) {
        await update(editingId, { nome: form.nome.trim(), allowed_pages: form.allowed_pages, ver_totais: form.ver_totais, ativo: form.ativo });
        if (form.senha.trim()) {
          await adminUsersAction({ action: 'reset_password', userId: editingId, password: form.senha.trim() });
        }
        if (editingId === currentUser.id) await refreshUser();
      } else {
        await adminUsersAction({
          action: 'create',
          email: form.email.trim(),
          password: form.senha.trim(),
          nome: form.nome.trim(),
          allowed_pages: form.allowed_pages,
          ver_totais: form.ver_totais,
        });
        await reload();
      }
      setModalOpen(false);
    } catch (err) {
      setError(err.message || 'Não foi possível salvar. Tente novamente.');
    } finally {
      setSaving(false);
    }
  }

  async function handleDelete(p) {
    if (p.role === 'admin_god') return;
    if (confirm(`Excluir completamente o login de "${p.nome}"? Essa ação não pode ser desfeita.`)) {
      try {
        await adminUsersAction({ action: 'delete', userId: p.id });
        await reload();
      } catch (err) {
        alert(err.message || 'Não foi possível excluir.');
      }
    }
  }

  return (
    <Layout title="Usuários" subtitle="Crie usuários e defina o que cada um pode acessar" page={page} onNavigate={onNavigate}>
      <div className="page-toolbar">
        <div className="title-block">
          <div className="eyebrow">Admin God</div>
          <h2>{perfis.length} usuário{perfis.length === 1 ? '' : 's'}</h2>
        </div>
        <button className="btn btn-primary" onClick={openNew}>+ Novo usuário</button>
      </div>

      <div className="table-wrap">
        {loading ? <div className="empty-state">Carregando…</div> : (
          <table>
            <thead>
              <tr>
                <th>Nome</th><th>E-mail</th><th>Perfil</th><th>Páginas liberadas</th><th>Vê totais?</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody>
              {perfis.map((p) => (
                <tr key={p.id}>
                  <td>{p.nome}</td>
                  <td>{p.email}</td>
                  <td><span className={`badge ${p.role === 'admin_god' ? 'badge-warning' : 'badge-neutral'}`}>{p.role === 'admin_god' ? 'Admin God' : 'Usuário'}</span></td>
                  <td>{p.role === 'admin_god' ? 'Tudo' : (p.allowed_pages || []).map((k) => ASSIGNABLE_PAGES.find((pg) => pg.key === k)?.label).join(', ') || '—'}</td>
                  <td><span className={`badge ${p.role === 'admin_god' || p.ver_totais ? 'badge-success' : 'badge-neutral'}`}>{p.role === 'admin_god' || p.ver_totais ? 'Sim' : 'Não'}</span></td>
                  <td><span className={`badge ${p.ativo ? 'badge-success' : 'badge-danger'}`}>{p.ativo ? 'Ativo' : 'Desativado'}</span></td>
                  <td>
                    <div className="row-actions">
                      <button className="btn btn-ghost btn-sm" onClick={() => openEdit(p)}>Editar</button>
                      {p.role !== 'admin_god' && <button className="btn btn-danger btn-sm" onClick={() => handleDelete(p)}>Excluir</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modalOpen && (
        <Modal title={editingId ? 'Editar usuário' : 'Novo usuário'} onClose={() => setModalOpen(false)}>
          <form onSubmit={handleSubmit}>
            {error && <div className="form-error">{error}</div>}
            <div className="form-grid">
              <div className="field">
                <label>Nome *</label>
                <input value={form.nome} onChange={(e) => setForm((f) => ({ ...f, nome: e.target.value }))} />
              </div>
              <div className="field">
                <label>E-mail *{editingId ? ' (não pode ser alterado aqui)' : ''}</label>
                <input
                  type="email" value={form.email} disabled={!!editingId}
                  onChange={(e) => setForm((f) => ({ ...f, email: e.target.value }))}
                />
              </div>
              <div className="field">
                <label>{editingId ? 'Nova senha (opcional)' : 'Senha inicial *'}</label>
                <input
                  type="text" value={form.senha}
                  onChange={(e) => setForm((f) => ({ ...f, senha: e.target.value }))}
                  placeholder={editingId ? 'Deixe em branco para manter a atual' : 'mínimo 6 caracteres'}
                />
              </div>
              {editingId && (
                <div className="field">
                  <label>Status</label>
                  <select value={form.ativo ? 'ativo' : 'inativo'} onChange={(e) => setForm((f) => ({ ...f, ativo: e.target.value === 'ativo' }))}>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Desativado</option>
                  </select>
                </div>
              )}
              <div className="field full">
                <label className="checkbox-row" style={{ display: 'inline-flex' }}>
                  <input type="checkbox" checked={form.ver_totais} onChange={(e) => setForm((f) => ({ ...f, ver_totais: e.target.checked }))} />
                  Pode ver totais e relatórios (quanto entrou, quanto saiu, saldo do dia/semana/mês)
                </label>
              </div>
              <div className="field full">
                <label>Páginas que este usuário pode acessar</label>
                <div className="checkbox-grid">
                  {ASSIGNABLE_PAGES.map((pg) => (
                    <label className="checkbox-row" key={pg.key}>
                      <input type="checkbox" checked={form.allowed_pages.includes(pg.key)} onChange={() => togglePage(pg.key)} />
                      {pg.label}
                    </label>
                  ))}
                </div>
              </div>
            </div>
            <div className="form-actions">
              <button type="button" className="btn btn-ghost" onClick={() => setModalOpen(false)}>Cancelar</button>
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? 'Salvando…' : 'Salvar'}</button>
            </div>
          </form>
        </Modal>
      )}
    </Layout>
  );
}

function desenharCabecalhoPDF(doc, subtitulo) {
  doc.setFillColor(31, 92, 69);
  doc.rect(0, 0, 210, 32, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text('Invites', 15, 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text('Gestão Financeira', 15, 24);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text(subtitulo, 195, 18, { align: 'right' });
  doc.setTextColor(20, 32, 27);
}

function desenharTituloSecao(doc, y, texto) {
  doc.setFillColor(31, 92, 69);
  doc.rect(15, y - 5.5, 180, 8, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.text(texto.toUpperCase(), 18, y);
  doc.setTextColor(20, 32, 27);
  return y + 12;
}

function desenharLinhaValor(doc, y, label, valor, opts) {
  const destaque = opts?.destaque;
  const corValor = opts?.cor || [20, 32, 27];
  if (destaque) {
    doc.setFillColor(241, 244, 239);
    doc.rect(15, y - 5.5, 180, 8, 'F');
  }
  doc.setFont('helvetica', destaque ? 'bold' : 'normal');
  doc.setFontSize(10.5);
  doc.setTextColor(20, 32, 27);
  doc.text(label, 18, y);
  doc.setTextColor(...corValor);
  doc.text(formatMoney(valor), 192, y, { align: 'right' });
  doc.setDrawColor(225, 230, 224);
  doc.setLineWidth(0.15);
  doc.line(15, y + 3, 195, y + 3);
  return y + 10;
}

function gerarRelatorioPDF(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const verde = [46, 125, 91];
  const vermelho = [168, 67, 47];

  desenharCabecalhoPDF(doc, 'RELATÓRIO FINANCEIRO');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text(d.label, 15, 44);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(91, 103, 96);
  doc.text(`Período de ${formatDate(d.inicio)} até ${formatDate(d.fim)}`, 15, 50);
  doc.setTextColor(20, 32, 27);

  let y = 64;
  y = desenharTituloSecao(doc, y, 'Resumo financeiro');
  y = desenharLinhaValor(doc, y, 'Total de entradas', d.totalEntradas, { destaque: true, cor: verde });
  y = desenharLinhaValor(doc, y, '— recebido em Encomendas', d.totalRecebidoEncomendas, { cor: verde });
  y = desenharLinhaValor(doc, y, '— outras entradas', d.totalEntradasLivres, { cor: verde });
  y = desenharLinhaValor(doc, y, 'Total de saídas', d.totalSaidas, { cor: vermelho });
  y = desenharLinhaValor(doc, y, 'Despesas da empresa', d.totalDespesas, { cor: vermelho });
  y = desenharLinhaValor(doc, y, 'Salários', d.totalSalarios, { cor: vermelho });
  y = desenharLinhaValor(doc, y, 'SALDO DO PERÍODO', d.saldo, { destaque: true, cor: d.saldo >= 0 ? verde : vermelho });

  y += 6;
  y = desenharTituloSecao(doc, y, 'Trabalhos e encomendas no período');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.text(`Total de encomendas: ${d.encomendasTotal}`, 18, y);
  doc.setFont('helvetica', 'normal');
  doc.text(`Concluídas: ${d.encomendasConcluidas}     Pendentes: ${d.encomendasPendentes}`, 110, y);
  y += 10;
  y = desenharLinhaValor(doc, y, 'Valor ainda a receber', d.valorAReceberPeriodo, { destaque: true, cor: vermelho });

  if (d.isAdminGod) {
    y += 6;
    y = desenharTituloSecao(doc, y, 'Despesas pessoais (confidencial — só Admin God)');
    y = desenharLinhaValor(doc, y, 'Despesas pessoais no período', d.totalDespesasPessoais, { destaque: true, cor: vermelho });
  }

  doc.setFontSize(8);
  doc.setTextColor(150, 150, 150);
  doc.text(`Relatório gerado pelo sistema de gestão financeira da Invites em ${new Date().toLocaleString('pt-AO')}.`, 15, 285);

  doc.save(`relatorio-invites-${nomeArquivo(d.label)}-${d.fim}.pdf`);
}

function periodoParaIntervalo(periodo, personalizado) {
  const fmt = (d) => d.toISOString().slice(0, 10);
  const hoje = new Date();
  const hojeStr = fmt(hoje);

  if (periodo === 'hoje') return { inicio: hojeStr, fim: hojeStr, label: 'Hoje' };

  if (periodo === 'semana') {
    const ini = new Date(hoje); ini.setDate(hoje.getDate() - 6);
    return { inicio: fmt(ini), fim: hojeStr, label: 'Últimos 7 dias' };
  }
  if (periodo === 'mes') {
    const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    return { inicio: fmt(ini), fim: hojeStr, label: 'Este mês' };
  }
  if (periodo === 'trimestre') {
    const trimestreAtual = Math.floor(hoje.getMonth() / 3);
    const ini = new Date(hoje.getFullYear(), trimestreAtual * 3, 1);
    return { inicio: fmt(ini), fim: hojeStr, label: `Trimestre atual (${ini.toLocaleString('pt-BR', { month: 'long' })} em diante)` };
  }
  if (periodo === 'ultimos3meses') {
    const ini = new Date(hoje.getFullYear(), hoje.getMonth() - 3, hoje.getDate());
    return { inicio: fmt(ini), fim: hojeStr, label: 'Últimos 3 meses' };
  }
  // personalizado
  return { inicio: personalizado.inicio || hojeStr, fim: personalizado.fim || hojeStr, label: 'Período personalizado' };
}

function Relatorios({ page, onNavigate }) {
  const { isAdminGod } = useAuth();
  const { items: entradas, loading: l1 } = useCollection('entradas');
  const { items: saidas, loading: l2 } = useCollection('saidas');
  const { items: despesasRaw, loading: l3 } = useCollection('despesas');
  const { items: salarios, loading: l4 } = useCollection('salarios');
  const { items: encomendas, loading: l5 } = useCollection('encomendas');
  const loading = l1 || l2 || l3 || l4 || l5;

  const [periodo, setPeriodo] = useState('mes');
  const [personalizado, setPersonalizado] = useState({ inicio: '', fim: '' });

  const { inicio, fim, label } = useMemo(() => periodoParaIntervalo(periodo, personalizado), [periodo, personalizado]);

  const dentroDoPeriodo = (data) => data && data >= inicio && data <= fim;

  const entradasPeriodo = useMemo(() => entradas.filter((i) => dentroDoPeriodo(i.data)), [entradas, inicio, fim]);
  const saidasPeriodo = useMemo(() => saidas.filter((i) => dentroDoPeriodo(i.data)), [saidas, inicio, fim]);
  const despesasEmpresaPeriodo = useMemo(
    () => despesasRaw.filter((i) => i.tipo !== 'Pessoal' && dentroDoPeriodo(i.data)),
    [despesasRaw, inicio, fim]
  );
  const despesasPessoaisPeriodo = useMemo(
    () => despesasRaw.filter((i) => i.tipo === 'Pessoal' && dentroDoPeriodo(i.data)),
    [despesasRaw, inicio, fim]
  );
  const salariosPeriodo = useMemo(
    () => salarios.filter((i) => i.mes_referencia && i.mes_referencia >= inicio.slice(0, 7) && i.mes_referencia <= fim.slice(0, 7)),
    [salarios, inicio, fim]
  );
  const encomendasPeriodo = useMemo(() => encomendas.filter((i) => dentroDoPeriodo(i.data_entrada)), [encomendas, inicio, fim]);
  const encomendasConcluidas = encomendasPeriodo.filter((i) => i.status === 'Concluído').length;
  const encomendasPendentes = encomendasPeriodo.filter((i) => i.status === 'Pendente').length;
  const valorAReceberPeriodo = encomendasPeriodo.reduce((s, i) => s + Math.max(0, Number(i.valor_total || 0) - Number(i.valor_pago || 0)), 0);

  const sumValor = (arr) => arr.reduce((s, i) => s + Number(i.valor || 0), 0);
  const sumPago = (arr) => arr.reduce((s, i) => s + Number(i.valor_pago || 0), 0);
  const totalEntradasLivres = sumValor(entradasPeriodo);
  const totalRecebidoEncomendas = sumPago(encomendasPeriodo);
  const totalEntradas = totalEntradasLivres + totalRecebidoEncomendas;
  const totalSaidas = sumValor(saidasPeriodo);
  const totalDespesas = sumValor(despesasEmpresaPeriodo);
  const totalDespesasPessoais = sumValor(despesasPessoaisPeriodo);
  const totalSalarios = salariosPeriodo.reduce((s, i) => s + salarioLiquido(i), 0);
  const saldo = totalEntradas - totalSaidas - totalDespesas - totalSalarios;

  const periodos = [
    { key: 'hoje', label: 'Diário (hoje)' },
    { key: 'semana', label: 'Semanal' },
    { key: 'mes', label: 'Mensal' },
    { key: 'trimestre', label: 'Trimestral' },
    { key: 'ultimos3meses', label: 'Últimos 3 meses' },
    { key: 'personalizado', label: 'Personalizado' },
  ];

  return (
    <Layout title="Relatórios" subtitle="Totais financeiros por período" page={page} onNavigate={onNavigate}>
      <div className="panel" style={{ marginBottom: 18 }}>
        <div className="panel-title">Escolha o período</div>
        <div className="checkbox-grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)', marginBottom: periodo === 'personalizado' ? 14 : 0 }}>
          {periodos.map((p) => (
            <label className="checkbox-row" key={p.key}>
              <input type="radio" name="periodo" checked={periodo === p.key} onChange={() => setPeriodo(p.key)} />
              {p.label}
            </label>
          ))}
        </div>
        {periodo === 'personalizado' && (
          <div className="form-grid" style={{ marginTop: 10 }}>
            <div className="field">
              <label>De</label>
              <input type="date" value={personalizado.inicio} onChange={(e) => setPersonalizado((f) => ({ ...f, inicio: e.target.value }))} />
            </div>
            <div className="field">
              <label>Até</label>
              <input type="date" value={personalizado.fim} onChange={(e) => setPersonalizado((f) => ({ ...f, fim: e.target.value }))} />
            </div>
          </div>
        )}
      </div>

      {loading ? (
        <div className="empty-state">Carregando…</div>
      ) : (
        <React.Fragment>
          <div className="page-toolbar">
            <div className="title-block">
              <div className="eyebrow">{label}</div>
              <h2>{formatDate(inicio)} até {formatDate(fim)}</h2>
            </div>
            <button
              className="btn btn-primary"
              onClick={() => gerarRelatorioPDF({
                label, inicio, fim,
                totalEntradas, totalEntradasLivres, totalRecebidoEncomendas,
                totalSaidas, totalDespesas, totalSalarios, saldo,
                isAdminGod, totalDespesasPessoais,
                encomendasTotal: encomendasPeriodo.length, encomendasConcluidas, encomendasPendentes, valorAReceberPeriodo,
              })}
            >
              ⬇ Baixar PDF
            </button>
          </div>
          <div className="stat-grid">
            <StatCard label="Entradas no período" value={totalEntradas} tone="positive" />
            <StatCard label="— recebido em Encomendas" value={totalRecebidoEncomendas} tone="positive" />
            <StatCard label="— outras entradas" value={totalEntradasLivres} tone="positive" />
            <StatCard label="Saídas no período" value={totalSaidas} tone="negative" />
            <StatCard label="Despesas da empresa no período" value={totalDespesas} tone="negative" />
            <StatCard label="Salários no período" value={totalSalarios} tone="negative" />
            <StatCard label="Saldo do período" value={saldo} tone={saldo >= 0 ? 'positive' : 'negative'} />
            {isAdminGod && <StatCard label="Despesas pessoais no período (só você vê)" value={totalDespesasPessoais} tone="negative" />}
          </div>
          <div className="panel" style={{ marginTop: 18 }}>
            <div className="panel-title">Trabalhos/encomendas no período</div>
            <div className="stat-grid" style={{ marginBottom: 0 }}>
              <div className="stat-card">
                <div className="stat-label">Encomendas no período</div>
                <div className="stat-value neutral">{encomendasPeriodo.length}</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Concluídas</div>
                <div className="stat-value positive">{encomendasConcluidas}</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Pendentes</div>
                <div className="stat-value negative">{encomendasPendentes}</div>
              </div>
              <StatCard label="Valor ainda a receber" value={valorAReceberPeriodo} tone="negative" />
            </div>
          </div>
        </React.Fragment>
      )}
    </Layout>
  );
}

// APP

class PageErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error('Erro ao desenhar a página:', error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="login-page">
          <div className="login-card" style={{ textAlign: 'center' }}>
            <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 22, marginBottom: 10 }}>
              Essa página deu um erro
            </h2>
            <p className="mono" style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 18, wordBreak: 'break-word' }}>
              {this.state.error?.message || 'Erro desconhecido.'}
            </p>
            <button className="btn btn-primary" onClick={() => window.location.reload()}>Recarregar página</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function AppShell() {
  const { user, loading, initError, isAdminGod, canSeeTotais, hasAccess } = useAuth();
  const [page, setPage] = useState('dashboard');

  useEffect(() => {
    if (!user) return;
    let allowed;
    if (page === 'usuarios' || page === 'saldo_inicial') allowed = isAdminGod;
    else if (page === 'relatorios') allowed = canSeeTotais;
    else allowed = hasAccess(page);
    if (!allowed) setPage('dashboard');
  }, [page, user, isAdminGod, canSeeTotais, hasAccess]);

  if (loading) return <div className="app-loading">Carregando…</div>;

  if (initError) {
    return (
      <div className="app-loading" style={{ flexDirection: 'column', gap: 14, padding: 24, textAlign: 'center' }}>
        <div>Não consegui conectar ao Supabase.</div>
        <div className="mono" style={{ fontSize: 12.5, color: '#cdd9d0', maxWidth: 480 }}>{initError}</div>
        <button className="btn btn-primary" onClick={() => window.location.reload()}>Tentar de novo</button>
      </div>
    );
  }

  if (!user) return <Login />;

  let conteudo;
  switch (page) {
    case 'encomendas': conteudo = <Encomendas page={page} onNavigate={setPage} />; break;
    case 'entradas': conteudo = <Entradas page={page} onNavigate={setPage} />; break;
    case 'saidas': conteudo = <Saidas page={page} onNavigate={setPage} />; break;
    case 'despesas': conteudo = <Despesas page={page} onNavigate={setPage} />; break;
    case 'salarios': conteudo = <Salarios page={page} onNavigate={setPage} />; break;
    case 'servicos': conteudo = <Servicos page={page} onNavigate={setPage} />; break;
    case 'relatorios': conteudo = canSeeTotais ? <Relatorios page={page} onNavigate={setPage} /> : <Dashboard page={page} onNavigate={setPage} />; break;
    case 'usuarios': conteudo = isAdminGod ? <Usuarios page={page} onNavigate={setPage} /> : <Dashboard page={page} onNavigate={setPage} />; break;
    case 'saldo_inicial': conteudo = isAdminGod ? <SaldoInicial page={page} onNavigate={setPage} /> : <Dashboard page={page} onNavigate={setPage} />; break;
    default: conteudo = <Dashboard page={page} onNavigate={setPage} />;
  }

  return <PageErrorBoundary key={page}>{conteudo}</PageErrorBoundary>;
}

function App() {
  return <AuthProvider><AppShell /></AuthProvider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
